.wrap{max-width:820px;margin:auto;padding:25px 14px 50px} header{text-align:center;color:#fff;padding:25px 7px 18px;text-shadow:0 2px 5px rgba(120,45,75,.4)}
.badge{display:inline-block;padding:6px 13px;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:900}
.community{margin-top:16px;font-size:clamp(18px,5vw,25px);font-weight:900} h1{font-size:clamp(34px,9vw,56px);margin:8px 0 5px;line-height:1.2}
.sub{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:999px;background:rgba(165,72,108,.28);font-size:14px;font-weight:700}
.card{background:rgba(255,247,251,.91);border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:19px;margin:16px 0;box-shadow:0 12px 35px rgba(151,65,101,.14)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.date{font-size:18px;font-weight:900;color:#b34f78} .progress{font-size:13px;color:#9b7081}
.actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
button,.back{font-family:"Yomogi",cursive;border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer;text-decoration:none}
button{background:#e97fa8;color:white} .ghost{background:#fff;color:#b34f78;border:1px solid #efabc5}
.words{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.word{background:rgba(255,255,255,.74);border-radius:17px;padding:13px 14px;min-height:94px}
.num{font-size:11px;color:#bc7892} .en{font-family:Arial,sans-serif;font-size:21px;font-weight:800;color:#df5e91;margin:3px 0 7px}
.jp{font-size:15px;font-weight:800;color:#8f4966} .pos{font-size:11px;color:#ae7b8e;margin-top:4px}
.hidden .jp,.hidden .pos{filter:blur(7px);user-select:none}
.note{font-size:13px;line-height:1.8;color:#9b7081;text-align:center}
.mastery{margin-top:12px;font-size:12px;color:#a66a82}
.check{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:#a66a82}
.check input{accent-color:#df5e91;width:17px;height:17px}
.word.done{opacity:.58}
.word.done .en{text-decoration:line-through}
.nav{text-align:center;margin-top:22px} .back{display:inline-block;background:rgba(255,255,255,.92);color:#b34f78;box-shadow:0 6px 18px rgba(130,55,85,.15)}
footer{font-size:clamp(14px,4.1vw,25px);font-weight:900;color:#fff;text-align:center;margin-top:34px;padding:12px 2px;white-space:nowrap;text-shadow:0 2px 4px rgba(130,55,85,.55)}
.copy{text-align:center;color:#fff;font-size:12px;margin-top:20px}

.history-actions{text-align:center;margin-top:18px}
.history-actions button{width:auto;padding:11px 18px}
.history-card{margin-top:16px}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;color:#a84d72}
.history-note{font-size:12px;color:#a66a82;margin:7px 0 14px}
.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.history-item{background:rgba(255,255,255,.72);border:1px solid rgba(222,126,163,.18);border-radius:14px;padding:10px 12px}
.history-item.done{opacity:.58}
.history-item.done .history-en{text-decoration:line-through}
.history-en{font-size:17px;font-weight:900;color:#a84d72}
.history-jp{font-size:12px;color:#7d5a68;margin-top:3px}
.history-check{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:#a66a82}
.history-check input{accent-color:#df5e91;width:16px;height:16px}

.date-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.date-btn{position:relative;border:1px solid rgba(255,255,255,.95);border-radius:14px;background:rgba(255,255,255,.76);color:#a84d72;font-family:"Yomogi",cursive;font-weight:900;padding:10px 5px;cursor:pointer;box-shadow:0 4px 10px rgba(137,58,91,.10)}
.date-btn:hover{background:rgba(255,255,255,.96)}
.date-btn.complete{background:rgba(255,247,251,.96);padding-right:25px}

const START="2026-09-24";
const SEEN_KEY="word20_seen_words_v1";
function tokyoISO(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function dayIndex(iso){const a=new Date(START+"T00:00:00+09:00"),b=new Date(iso+"T00:00:00+09:00");return Math.max(0,Math.floor((b-a)/86400000))}
let current=[];
function render(){
 const iso=tokyoISO(), idx=dayIndex(iso), totalDays=Math.ceil(WORDS.length/20), page=idx%totalDays, start=page*20;
 current=WORDS.slice(start,start+20); if(current.length<20) current=current.concat(WORDS.slice(0,20-current.length));
 markSeenThroughToday(idx);
 document.getElementById("today").textContent=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());
 document.getElementById("progress").textContent=`${page+1} / ${totalDays}日目`;
 draw(current);
}
function draw(arr){document.getElementById("words").innerHTML=arr.map((x,i)=>`<div class="word"><div class="num">${i+1}</div><div class="en">${x.w}</div><div class="jp">${x.m}</div><div class="pos">${x.p}</div><label class="check"><input type="checkbox" data-word="${x.w}" ${isDone(x.w)?"checked":""}>覚えた！</label></div>`).join("");bindChecks()}
document.getElementById("toggle").onclick=()=>{const w=document.getElementById("words"),b=document.getElementById("toggle");w.classList.toggle("hidden");const hidden=w.classList.contains("hidden");b.textContent=hidden?"意味を表示":"意味を隠す";b.classList.toggle("ghost",!hidden)};
document.getElementById("shuffle").onclick=()=>{current=[...current].sort(()=>Math.random()-.5);draw(current)};
render();

function doneKey(w){return "word20_done_"+w.toLowerCase()}
function isDone(w){return localStorage.getItem(doneKey(w))==="1"}
function bindChecks(){
 document.querySelectorAll(".check input").forEach(c=>{
   const card=c.closest(".word");
   if(c.checked)card.classList.add("done");
   c.onchange=()=>{
     if(c.checked)localStorage.setItem(doneKey(c.dataset.word),"1");
     else localStorage.removeItem(doneKey(c.dataset.word));
     card.classList.toggle("done",c.checked);
     updateMastery();
   };
 });
 updateMastery();
}
function updateMastery(){
 const learned=WORDS.filter(x=>isDone(x.w)).length;
 document.getElementById("mastery").textContent=`覚えた単語：${learned} / ${WORDS.length}語`;
}
document.getElementById("bankinfo").textContent=`収録語数：${WORDS.length}語（20語ずつ・${Math.ceil(WORDS.length/20)}日で1周）`;

function getSeen(){
 try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"))}catch(e){return new Set()}
}
function saveSeen(set){localStorage.setItem(SEEN_KEY,JSON.stringify([...set]))}
function markSeenThroughToday(idx){
 const seen=getSeen(), totalDays=Math.ceil(WORDS.length/20);
 const maxDay=Math.min(idx,totalDays-1);
 for(let d=0;d<=maxDay;d++) dayWords(d).forEach(x=>seen.add(x.w.toLowerCase()));
 saveSeen(seen);
}
function dayWords(d){
 const st=d*20;
 let batch=WORDS.slice(st,st+20);
 if(batch.length<20) batch=batch.concat(WORDS.slice(0,20-batch.length));
 return batch;
}
function dateForDay(d){
 const x=new Date(START+"T00:00:00+09:00");
 x.setDate(x.getDate()+d);
 return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short"}).format(x);
}
function dayComplete(d){return dayWords(d).every(x=>isDone(x.w))}
function drawDateGrid(){
 const idx=dayIndex(tokyoISO()), totalDays=Math.ceil(WORDS.length/20), maxDay=Math.min(idx,totalDays-1);
 const grid=document.getElementById("dateGrid");
 document.getElementById("historyCount").textContent=`${(maxDay+1)*20}語分`;
 grid.innerHTML=Array.from({length:maxDay+1},(_,d)=>`<button class="date-btn ${dayComplete(d)?"complete":""}" data-day="${d}">${dateForDay(d)}${dayComplete(d)?'<span class="complete-mark">✓</span>':''}</button>`).join("");
 grid.querySelectorAll(".date-btn").forEach(b=>b.onclick=()=>showHistoryDay(Number(b.dataset.day),b));
}
function showHistoryDay(d,btn){
 document.querySelectorAll(".date-btn").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 const arr=dayWords(d), box=document.getElementById("historyDay");
 box.style.display="block";
 document.getElementById("historyDayTitle").textContent=`${dateForDay(d)} の20語`;
 document.getElementById("historyList").innerHTML=arr.map(x=>`<div class="history-item ${isDone(x.w)?"done":""}"><div class="history-en">${x.w}</div><div class="history-jp">${x.m}</div><label class="history-check"><input type="checkbox" data-word="${x.w}" ${isDone(x.w)?"checked":""}>覚えた！</label></div>`).join("");
 document.querySelectorAll(".history-check input").forEach(c=>c.onchange=()=>{
   if(c.checked)localStorage.setItem(doneKey(c.dataset.word),"1"); else localStorage.removeItem(doneKey(c.dataset.word));
   updateMastery(); draw(current); drawDateGrid();
   const nb=document.querySelector(`.date-btn[data-day="${d}"]`); if(nb)showHistoryDay(d,nb);
 });
}
document.getElementById("historyBtn").onclick=()=>{
 const card=document.getElementById("historyCard"), opening=card.style.display==="none";
 card.style.display=opening?"block":"none";
 document.getElementById("historyBtn").textContent=opening?"履歴を閉じる":"これまでに出た単語を見る";
 if(opening){drawDateGrid();document.getElementById("historyDay").style.display="none";}
};
