function update(){

 if(!p){box.innerHTML='<div class="note">都道府県を選択してください</div>';return}
 const exam=exams[p];
 const now=new Date();
 const todayISO=now.toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});
 const today=new Date(todayISO+"T00:00:00+09:00");
 const all=[exam.main,...(exam.days||[])];
 const target=new Date(exam.main+"T00:00:00+09:00");
 const finalDate=new Date(all[all.length-1]+"T00:00:00+09:00");
 const days=Math.ceil((target-today)/86400000);
 const safe=Math.max(0,days);
 const months=Math.floor(safe/30), rest=safe%30;
 const isExamDay=all.includes(todayISO);
 const isFinished=today>finalDate;

 const dateBlock=all.length===1
   ? `<div class="date">📅 ${fmt(target)}</div>`
   : all.map((iso,i)=>`<div class="date${i?' extra-day':''}">📅 ${i+1}日目：${fmt(new Date(iso+"T00:00:00+09:00"))}</div>`).join("");
 const other=exam.other?.length
   ? `<div class="other-schedules"><div class="other-title">その他の日程</div>${exam.other.map(([n,d])=>`<div class="date">${n}：${fmt(new Date(d+"T00:00:00+09:00"))}</div>`).join("")}</div>`
   : "";

 let mainDisplay="";
 if(isExamDay){
   mainDisplay=`<div class="status-message">入試本番！</div>`;
 }else if(isFinished){
   mainDisplay=`<div class="status-message">お疲れ様でした！</div>`;
 }else{
   mainDisplay=`<div class="days">${safe}</div><div class="unit">日</div>`;
 }

 const countdownNote=(!isExamDay && !isFinished)
   ? `<div class="note" style="margin-top:10px">約 ${months}ヶ月${rest?`と${rest}日`:""} ｜ 1日目までをカウント ｜ 毎日自動更新</div>`
   : "";

 box.innerHTML=`<div class="pref">${p}</div>
 <div class="note">${exam.type}</div>
 ${mainDisplay}
 ${dateBlock}${other}
 ${countdownNote}`;
 updateDailyMessage(todayISO);
}
function updateDailyMessage(todayISO){
 const el=document.getElementById("daily-message");
 if(!el)return;
 const msg=dailyMessages[todayISO];
 if(msg){
   el.innerHTML=`<div class="daily-label">☁️ 今日のひとこと</div><div class="daily-text">${msg}</div>`;
   el.style.display="block";
 }else{
   el.style.display="none";
 }
}

select.addEventListener("change",update);
updateDailyMessage(new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"}));
update();
</script>
</body>
</html>
